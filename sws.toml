[general]
host = "::"
port = 8080
root = "/home/sws/public"
log-level = "info"
cache-control-headers = false
compression = true
compression-level = "default"
compression-static = false
directory-listing = false
ignore-hidden-files = true
disable-symlinks = true
health = true

[advanced]

[[advanced.headers]]
source = "**/*"
[advanced.headers.headers]
Cache-Control = "public, max-age=0, must-revalidate"
Content-Security-Policy = "default-src 'none'; style-src 'self'; font-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"
Cross-Origin-Opener-Policy = "same-origin"
Permissions-Policy = "camera=(), geolocation=(), microphone=(), payment=(), usb=()"
Referrer-Policy = "strict-origin-when-cross-origin"
X-Content-Type-Options = "nosniff"
X-Frame-Options = "DENY"

[[advanced.headers]]
source = "/_astro/**"
headers.Cache-Control = "public, max-age=31536000, immutable"
