bullets:
  - Reverse-engineered an Android application's camera API and anonymous OAuth
    flow, then built a fault-tolerant Python pipeline to collect, deduplicate,
    and persist timestamped campus gym imagery and metadata in SQLite.
  - Developed a computer-vision pipeline using YOLO, tiled inference, spatial
    zones, and equipment polygons to estimate occupancy and machine
    availability; reduced mean count error from 6.0 to 1.5 people in an initial
    manually labeled evaluation.
  - Deployed collection and inference across Linux systems with systemd
    recovery, stale-feed detection, atomic database snapshots, and secure
    Tailscale/Syncthing synchronization; optimized GTX 1070 Ti inference to run
    nine detection passes per image in ~0.5 seconds.
